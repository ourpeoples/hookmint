name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Dependency audit (production, high or worse)
        run: npm run audit
      - name: Build and boot the compiled server
        run: |
          npm run build
          PORT=3917 node dist/http.js &
          pid=$!
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3917/healthz && break; sleep 0.5; done
          curl -fs http://127.0.0.1:3917/readyz
          kill -TERM $pid
          wait $pid

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Render tests (real browser, real video)
        run: npm run test:render
        env:
          HOOKMINT_REQUIRE_RENDER: "1"

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Whole suite against real Postgres, plus row-level security and concurrency tests
        run: npm run test:pg
        env:
          HOOKMINT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
